services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-hkexl_wp}
      MYSQL_USER: ${WORDPRESS_DB_USER:-hkexl}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change_this_password}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-change_this_root_password}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.6-php8.2-apache
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-hkexl_wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-hkexl}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change_this_password}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', true);
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/hkexl-cms-fields:/var/www/html/wp-content/plugins/hkexl-cms-fields
      - ./import:/import

  phpmyadmin:
    image: phpmyadmin:5.2
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-change_this_root_password}

volumes:
  db_data:
  wp_data:
